<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automazioni · Per area</title>
<link rel="stylesheet" href="/varianti/base.css">
<style>
/* C · Per area: un'area alla volta, come stanze. Ogni automazione è una frase: quando, cosa fa per te. */
:root { --bg:#0e0e0d; --s1:#161614; --s2:#1d1d1a; --s3:#262622; --line:#2a2a26; --fg:#efeee9; --fg2:#b1afa6; --mut:#86847b; }
.top { display:flex; align-items:center; gap:20px; padding:0 20px; height:48px; }
.top b { font-weight:600; }
.top nav { display:flex; gap:18px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; }
.top nav::-webkit-scrollbar { display:none; }
.top nav a { text-decoration:none; color:var(--mut); white-space:nowrap; }
.top nav a[aria-current] { color:var(--fg); }

.tabs { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
.tabs [role=tablist] { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:0 14px; max-width:860px; margin:0 auto; }
.tabs [role=tablist]::-webkit-scrollbar { display:none; }
.tab { border:0; background:none; cursor:pointer; padding:12px 8px 11px; color:var(--mut); white-space:nowrap; border-bottom:2px solid transparent; display:flex; align-items:center; gap:7px; }
.tab:hover { color:var(--fg2); }
.tab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--fg); }
.tab i { width:7px; height:7px; border-radius:50%; background:transparent; }
.tab i.te { background:var(--te); } .tab i.bad { background:var(--bad); }

main { max-width:860px; margin:0 auto; padding:30px 20px 80px; }
.ahd h1 { margin:0; font-size:30px; font-weight:600; letter-spacing:-.03em; line-height:1.1; }
.ahd p { margin:8px 0 0; color:var(--fg2); font-size:15px; }
.ahd .st { margin-top:14px; font-size:13.5px; color:var(--mut); }
.ahd .st b { color:var(--fg); font-weight:600; }
.ahd .st b.te { color:var(--te); } .ahd .st b.bad { color:var(--bad); }
.ahd { margin-bottom:28px; }

/* Problema in evidenza */
.pb { border-left:3px solid var(--te); padding:4px 0 4px 18px; margin:0 0 26px; }
.pb.rotto { border-left-color:var(--bad); }
.pb .k { font-size:12px; font-weight:600; color:var(--te); letter-spacing:.03em; }
.pb.rotto .k { color:var(--bad); }
.pb h2 { margin:4px 0 4px; font-size:19px; font-weight:600; letter-spacing:-.015em; }
.pb p { margin:0 0 6px; }
.pb .lbl { color:var(--mut); }
.acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.btn { min-height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:var(--s2); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
.btn:hover { border-color:var(--fg2); }
.btn.pri { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
.note { display:none; flex-direction:column; gap:8px; margin-top:10px; max-width:520px; }
.note.on { display:flex; }
.note textarea { min-height:70px; background:var(--s1); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; resize:vertical; }
.ok-msg { color:var(--ok); margin-top:10px; }

/* Frasi */
.lst { border-top:1px solid var(--line); }
.s { border-bottom:1px solid var(--line); }
.s > button { width:100%; border:0; background:none; text-align:left; cursor:pointer; display:grid; grid-template-columns:132px minmax(0,1fr) auto; gap:4px 18px; padding:14px 0; align-items:baseline; }
.s .wh { font-size:12.5px; color:var(--mut); font-variant-numeric:tabular-nums; }
.s .tt b { font-weight:600; display:block; }
.s .tt span { color:var(--fg2); font-size:13.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.s > button[aria-expanded="true"] .tt span { display:block; }
.s .lr { font-size:12.5px; color:var(--mut); white-space:nowrap; }
.s .lr.err { color:var(--bad); }
.sd { padding:0 0 16px 150px; font-size:13.5px; }
.sd p { margin:0 0 8px; }
.sd .lbl { color:var(--mut); }
.sd .ticks { display:inline-flex; gap:2px; align-items:flex-end; height:14px; vertical-align:-2px; margin-left:8px; }
.sd .ticks i { width:3px; height:9px; border-radius:1px; background:color-mix(in srgb,var(--ok) 70%,var(--s3)); }
.sd .ticks i.error { background:var(--bad); height:14px; }
.sd details { margin-top:8px; color:var(--mut); font-size:12px; }
.sd summary { cursor:pointer; min-height:24px; }
.sd pre { white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--mono); font-size:11.5px; background:var(--s1); padding:8px 10px; border-radius:6px; color:var(--fg2); }

/* Workflow */
.wl { display:grid; grid-template-columns:220px minmax(0,1fr); gap:28px; }
.wl ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.wl li button { width:100%; border:0; background:none; text-align:left; cursor:pointer; padding:11px 10px; border-bottom:1px solid var(--line); display:block; }
.wl li button[aria-current="true"] { background:var(--s1); }
.wl li b { display:block; font-weight:500; }
.wl li small { color:var(--mut); font-size:12px; }
.wl li small.err { color:var(--bad); }
.wd h2 { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:-.015em; }
.wd > p { color:var(--fg2); margin:0 0 20px; font-size:13.5px; }

@media (max-width:640px) {
  main { padding:24px 16px 64px; }
  .ahd h1 { font-size:25px; }
  .s > button { grid-template-columns:minmax(0,1fr) auto; }
  .s .wh { grid-column:1 / -1; order:-1; }
  .sd { padding-left:0; }
  .wl { grid-template-columns:1fr; gap:18px; }
}
</style>
<body>
<header class="top"><b>Hub</b><nav aria-label="Sezioni"><a href="#" aria-current="page">Automazioni</a><a href="/#sessions">Sessioni</a><a href="/#accounts">Account</a><a href="/#usage">Consumi</a><a href="/#overview">Panoramica</a></nav></header>
<div class="tabs"><div role="tablist" aria-label="Aree" id="tabs"></div></div>
<main id="app" role="tabpanel" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="/varianti/common.js"></script>
<script>
var H = HubV, model = null, ui = { tab: null, item: null, wf: 0, saved: {} };
var $ = function (id) { return document.getElementById(id); };

function skeleton() {
  $('tabs').innerHTML = '<span class="sk" style="width:520px;height:16px;margin:14px 6px"></span>';
  var s = '<div style="display:grid;grid-template-columns:132px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)"><div class="sk" style="height:12px"></div><div><div class="sk" style="width:45%;height:14px;margin-bottom:6px"></div><div class="sk" style="width:75%;height:12px"></div></div></div>';
  return '<span class="sr">Carico le automazioni…</span><div class="sk" style="width:40%;height:30px;margin-bottom:12px"></div><div class="sk" style="width:60%;height:15px;margin-bottom:34px"></div>' + s.repeat(5);
}

function tabsHtml(gs) {
  var list = gs.map(function (g) { return { id: g.id, title: g.title, mark: g.te ? 'te' : g.rotto ? 'bad' : '' }; });
  if (H.workflows(model).length) list.push({ id: 'wf', title: 'Workflow', mark: (model.workflows || {}).failed ? 'bad' : '' });
  return list.map(function (t) {
    var sel = ui.tab === t.id;
    return '<button class="tab" role="tab" id="tab-' + t.id + '" aria-selected="' + sel + '" tabindex="' + (sel ? 0 : -1) + '" data-tab="' + t.id + '"><i class="' + t.mark + '" aria-hidden="true"></i>' + H.esc(t.title) + (t.mark ? '<span class="sr">, ' + (t.mark === 'te' ? 'ti aspetta' : 'ha problemi') + '</span>' : '') + '</button>';
  }).join('');
}

function pbHtml(c, now) {
  var br = H.ifBroken(c), s = ui.saved[c.key];
  return '<section class="pb ' + c.level + '" data-k="' + H.esc(c.key) + '"><div class="k">' + (c.level === 'te' ? 'Ti aspetta' : 'Rotta, può aspettare') + '</div><h2>' + H.esc(c.title) + '</h2>' +
    '<p>' + H.esc(c.reason || '') + '</p>' + (H.forYou(c) ? '<p><span class="lbl">Fa per te: </span>' + H.esc(H.forYou(c)) + '</p>' : '') +
    (br ? '<p><span class="lbl">Se resta così: </span>' + H.esc(br) + '</p>' : '') +
    (s ? '<p class="ok-msg">' + H.esc(s) + '</p>' : '<div class="acts"><button class="btn pri" data-a="ok">Va bene così</button><button class="btn" data-a="cambia">Va cambiata</button></div><div class="note"><label class="sr" for="n' + H.esc(c.key) + '">Cosa va cambiato</label><textarea id="n' + H.esc(c.key) + '" placeholder="Cosa va cambiato? Lo passo a un agente."></textarea><div><button class="btn pri" data-a="salva">Manda</button></div></div>') + '</section>';
}

function sentence(c, now) {
  var open = ui.item === c.key, l = c.last || {}, err = l.outcome === 'error';
  var h = '<div class="s"><button aria-expanded="' + open + '" data-it="' + H.esc(c.key) + '"><span class="wh">' + H.esc(c.when || (c.next ? 'prossimo ' + H.short(c.next, now) : '')) + '</span>' +
    '<span class="tt"><b>' + H.esc(c.title) + '</b>' + (H.forYou(c) ? '<span>' + H.esc(H.forYou(c)) + '</span>' : '') + '</span>' +
    '<span class="lr' + (err ? ' err' : '') + '">' + H.esc(l.at ? H.short(l.at, now) + (err ? ' fallito' : '') : 'mai') + '</span></button>';
  if (open) {
    var br = H.ifBroken(c), t = c.tech || {};
    var runs = H.cardRuns(c, 14);
    h += '<div class="sd">' + (br ? '<p><span class="lbl">Se si rompe: </span>' + H.esc(br) + '</p>' : '') +
      '<p><span class="lbl">Ultimo giro </span>' + H.esc(l.at ? H.when(l.at, now) + ', ' + H.outcome(l.outcome) : 'mai') +
      (runs.length > 1 ? '<span class="ticks" role="img" aria-label="ultimi ' + runs.length + ' giri">' + runs.map(function (r) { return '<i class="' + (r.outcome === 'error' ? 'error' : '') + '"></i>'; }).join('') + '</span>' : '') + '</p>' +
      (c.next ? '<p><span class="lbl">Prossimo </span>' + H.esc((c.nextApprox ? 'verso ' : '') + H.when(c.next, now)) + '</p>' : '') +
      (c.means ? '<p><span class="lbl">Ti scrive </span>' + H.esc(c.means) + '</p>' : '') +
      '<details><summary>Dettagli tecnici</summary><p style="margin:8px 0 4px">' + H.esc(H.sys(c.provider).name) + ' · ' + H.esc(c.key) + (t.schedule ? ' · ' + H.esc(t.schedule) : '') + '</p>' + ((t.command || t.prompt) ? '<pre>' + H.esc(t.command || t.prompt) + '</pre>' : '') + '</details></div>';
  }
  return h + '</div>';
}

function areaHtml(g, now) {
  var pbs = g.cards.filter(function (c) { return c.level === 'te' || c.level === 'rotto'; });
  var rest = g.cards.filter(function (c) { return c.level !== 'te' && c.level !== 'rotto'; });
  var st = g.te ? '<b class="te">' + H.esc(H.areaWord(g)) + '</b>' : g.rotto ? '<b class="bad">' + H.esc(H.areaWord(g)) + '</b>' : '<b>Tutto regolare</b>';
  var h = '<div class="ahd"><h1>' + H.esc(g.title) + '</h1><p>' + H.esc(g.lede) + '</p><div class="st">' + st + ' · ' + g.cards.length + (g.cards.length === 1 ? ' automazione' : ' automazioni') + ' · ' + H.n(g.runsToday) + ' giri oggi</div></div>';
  h += pbs.map(function (c) { return pbHtml(c, now); }).join('');
  if (rest.length) h += '<div class="lst">' + rest.map(function (c) { return sentence(c, now); }).join('') + '</div>';
  return h;
}

function wfPage(now) {
  var ws = H.workflows(model), i = Math.min(ui.wf, ws.length - 1), w = ws[i];
  var wf = model.workflows || {};
  var h = '<div class="ahd"><h1>Workflow</h1><p>Lavori in più passi: il meccanico va a esecutori gratis o a quota fissa, il giudizio a Claude.</p><div class="st"><b>' + wf.total + ' giri</b> in ' + wf.days + ' giorni' + (wf.failed ? ' · <b class="bad">' + wf.failed + ' falliti</b>' : ' · nessuno fallito') + '</div></div>';
  h += '<div class="wl"><ul>' + ws.map(function (x, j) {
    var t = H.wfTokens(H.wfPhases(x.last));
    return '<li><button aria-current="' + (j === i) + '" data-wf="' + j + '"><b>' + H.esc(x.title) + '</b><small class="' + (x.last.outcome === 'error' ? 'err' : '') + '">' + H.esc(H.short(x.last.at, now) + ' · ' + (x.last.outcome === 'error' ? 'fallito' : t.saved ? t.pct + '% fuori da Claude' : H.tok(t.total) + ' token, tutti Claude')) + '</small></button></li>';
  }).join('') + '</ul>';
  h += '<div class="wd"><h2>' + H.esc(w.title) + '</h2><p>' + H.esc((w.last.summary ? w.last.summary + ' · ' : '') + H.when(w.last.at, now) + (w.last.durationMs ? ', ' + H.dur(w.last.durationMs) : '')) + '</p>' + H.flowHtml(w, now) + '</div></div>';
  return h;
}

function render() {
  var now = model.checkedAt, gs = H.areas(model).filter(function (g) { return g.cards.length; });
  if (!ui.tab) { var first = gs.find(function (g) { return g.te || g.rotto; }) || gs[0]; ui.tab = first ? first.id : 'wf'; }
  $('tabs').innerHTML = tabsHtml(gs);
  var g = gs.find(function (x) { return x.id === ui.tab; });
  $('app').setAttribute('aria-labelledby', 'tab-' + ui.tab);
  $('app').innerHTML = ui.tab === 'wf' ? wfPage(now) : g ? areaHtml(g, now) : '<p>Quest’area è vuota.</p>';
}

function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 2400); }
function find(k) { return H.all(model).find(function (c) { return c.key === k; }); }
async function act(el, a) {
  var box = el.closest('[data-k]'), c = find(box.dataset.k); if (!c) return;
  if (a === 'cambia') { box.querySelector('.note').classList.add('on'); box.querySelector('textarea').focus(); return; }
  var r;
  if (a === 'salva') { var n = box.querySelector('textarea').value.trim(); if (!n) return box.querySelector('textarea').focus(); r = await H.vote(c, 'cambia', n); if (r && r.ok !== false) ui.saved[c.key] = 'Passata a un agente.'; }
  if (a === 'ok') { r = await H.vote(c, 'ok'); if (r && r.ok !== false) ui.saved[c.key] = 'Segnata come «va bene».'; }
  toast(r && r.ok !== false ? 'Salvato' : 'Non salvato, riprova');
  render();
}
function go(tab) { ui.tab = tab; ui.item = null; render(); var t = $('tab-' + tab); if (t) { t.focus(); t.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } }
document.addEventListener('click', function (e) {
  var t = e.target, b;
  if ((b = t.closest('[data-tab]'))) return go(b.dataset.tab);
  if ((b = t.closest('[data-a]'))) return act(b, b.dataset.a);
  if ((b = t.closest('[data-it]'))) { var k = b.dataset.it; ui.item = ui.item === k ? null : k; render(); var f = document.querySelector('[data-it="' + CSS.escape(k) + '"]'); if (f) f.focus(); return; }
  if ((b = t.closest('[data-wf]'))) { ui.wf = +b.dataset.wf; render(); var w = document.querySelector('[data-wf="' + ui.wf + '"]'); if (w) w.focus(); return; }
  if (t.closest('[data-retry]')) refresh();
});
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); act(e.target, 'salva'); } return; }
  if (!e.target.closest || !e.target.closest('[role=tablist]')) return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]')), i = tabs.indexOf(e.target);
  var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
  e.preventDefault(); go(n.dataset.tab);
});

async function refresh() {
  var m = await H.load();
  if (!m) { if (!model) { $('tabs').innerHTML = ''; $('app').innerHTML = '<div class="ahd"><h1>Non riesco a leggere le automazioni.</h1><p>L’hub non risponde. Se il Mac è sotto carico può metterci un minuto.</p></div><button class="btn pri" data-retry>Riprova</button>'; } return; }
  model = m;
  if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render();
}
$('app').innerHTML = skeleton();
refresh();
setInterval(refresh, 60000);
</script>
