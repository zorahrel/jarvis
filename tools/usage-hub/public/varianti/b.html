<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automazioni · Lavoro e risparmio</title>
<link rel="stylesheet" href="/varianti/base.css">
<style>
/* B · Lavoro e risparmio: si parte da ciò per cui i workflow esistono, i token fuori da Claude.
   Gli avvisi stanno in una riga; le aree in fondo, compatte. */
:root { --bg:#0b0c10; --s1:#12141a; --s2:#181b22; --s3:#20242c; --line:#22262e; --fg:#eceef2; --fg2:#a7adb8; --mut:#7b818c; }
.top { display:flex; align-items:center; gap:20px; padding:0 20px; height:48px; border-bottom:1px solid var(--line); }
.top b { font-weight:600; }
.top nav { display:flex; gap:18px; height:100%; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; }
.top nav::-webkit-scrollbar { display:none; }
.top nav a { display:flex; align-items:center; text-decoration:none; color:var(--mut); white-space:nowrap; border-bottom:2px solid transparent; }
.top nav a[aria-current] { color:var(--fg); border-bottom-color:var(--fg); }
main { max-width:760px; margin:0 auto; padding:28px 20px 80px; }

/* Riga avvisi */
.alert { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:color-mix(in srgb,var(--te) 9%,var(--s1)); border:1px solid color-mix(in srgb,var(--te) 28%,var(--line)); margin-bottom:28px; }
.alert.bad { background:color-mix(in srgb,var(--bad) 8%,var(--s1)); border-color:color-mix(in srgb,var(--bad) 28%,var(--line)); }
.alert .k { font-weight:600; color:var(--te); white-space:nowrap; }
.alert.bad .k { color:var(--bad); }
.alert .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.alert button { border:0; background:none; color:var(--fg); cursor:pointer; white-space:nowrap; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--fg2); min-height:28px; }
.calm { color:var(--fg2); margin:0 0 28px; font-size:13.5px; }
.calm b { color:var(--ok); font-weight:600; }

/* Risparmio della settimana */
.hero { margin-bottom:36px; }
.hero h1 { font-size:13px; font-weight:500; color:var(--mut); margin:0 0 6px; }
.hero .big { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.hero .big b { font-size:52px; line-height:1; font-weight:600; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
.hero .big span { font-size:15px; color:var(--fg2); max-width:34ch; }
.hero .big.none b { color:var(--x-claude); }
.hero .fl-bar { height:12px; border-radius:6px; }
.hero .flag { margin-top:10px; font-size:12px; color:var(--te); }

/* Workflow */
.wfs > h2, .areas > h2 { font-size:15px; font-weight:600; margin:0 0 12px; display:flex; justify-content:space-between; gap:12px; }
.wfs > h2 span, .areas > h2 span { color:var(--mut); font-weight:400; font-size:13px; }
.w { border:1px solid var(--line); border-radius:12px; background:var(--s1); margin-bottom:10px; }
.w > button { width:100%; text-align:left; border:0; background:none; cursor:pointer; padding:14px 16px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; align-items:center; }
.w .n b { font-weight:600; }
.w .n small { display:block; color:var(--mut); font-size:12.5px; }
.w .n small.bad { color:var(--bad); }
.w .p { text-align:right; font-variant-numeric:tabular-nums; }
.w .p b { font-size:17px; font-weight:600; letter-spacing:-.02em; }
.w .p small { display:block; font-size:11.5px; color:var(--mut); }
.mf { grid-column:1 / -1; display:flex; align-items:center; gap:0; margin-top:8px; overflow:hidden; }
.mf span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--fg2); padding:3px 8px; border-radius:6px; background:var(--s2); white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.mf span i { width:7px; height:7px; border-radius:50%; background:var(--x,var(--mut)); flex:none; }
.mf span.err { color:var(--bad); }
.mf em { flex:0 0 14px; height:1px; background:var(--line); }
.w .body { padding:4px 16px 18px; border-top:1px solid var(--line); }
.w .body > p { color:var(--fg2); font-size:13.5px; margin:14px 0 16px; }
.w .hist { margin-top:16px; font-size:12.5px; color:var(--mut); }

/* Aree, compatte */
.areas { margin-top:36px; }
.ag { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.a { text-align:left; border:1px solid var(--line); background:var(--s1); border-radius:10px; padding:12px; cursor:pointer; min-height:76px; display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
.a[aria-expanded="true"] { border-color:var(--fg2); }
.a b { font-weight:600; font-size:13.5px; }
.a span { font-size:12.5px; color:var(--mut); }
.a span.te { color:var(--te); } .a span.bad { color:var(--bad); }
.al { margin-top:10px; border:1px solid var(--line); border-radius:10px; background:var(--s1); padding:4px 14px; }
.al p.ld { color:var(--fg2); font-size:13px; margin:10px 0 6px; }
.li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:10px 0; border-top:1px solid var(--line); }
.li:first-of-type { border-top:0; }
.li b { font-weight:500; }
.li small { color:var(--mut); font-size:12.5px; grid-column:1; }
.li .st { font-size:12.5px; color:var(--mut); grid-row:1; grid-column:2; text-align:right; white-space:nowrap; }
.li .st.te { color:var(--te); } .li .st.bad { color:var(--bad); }
.btn { min-height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:var(--s2); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
.btn.pri { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
.det { grid-column:1 / -1; padding:8px 0 4px; font-size:13px; }
.det p { margin:0 0 8px; }
.det .lbl { color:var(--mut); }
.acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.note { display:none; flex-direction:column; gap:8px; margin-top:10px; }
.note.on { display:flex; }
.note textarea { min-height:64px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; resize:vertical; }
.ok-msg { color:var(--ok); }

@media (max-width:560px) {
  main { padding:22px 16px 64px; }
  .hero .big b { font-size:42px; }
  .ag { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .alert { flex-wrap:wrap; }
  .alert .t { white-space:normal; }
}
</style>
<body>
<header class="top"><b>Hub</b><nav aria-label="Sezioni"><a href="#" aria-current="page">Automazioni</a><a href="/#sessions">Sessioni</a><a href="/#accounts">Account</a><a href="/#usage">Consumi</a><a href="/#overview">Panoramica</a></nav></header>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="/varianti/common.js"></script>
<script>
var H = HubV, model = null, ui = { wf: -1, area: null, item: null, saved: {}, allWf: false };
var $ = function (id) { return document.getElementById(id); };

function skeleton() {
  var w = '<div class="w" aria-hidden="true" style="padding:16px"><div class="sk" style="width:40%;height:14px;margin-bottom:8px"></div><div class="sk" style="width:25%;height:11px;margin-bottom:12px"></div><div class="sk" style="width:70%;height:20px"></div></div>';
  return '<span class="sr">Carico le automazioni…</span><div class="sk" style="height:46px;border-radius:10px;margin-bottom:28px"></div><div class="sk" style="width:30%;height:12px;margin-bottom:10px"></div><div class="sk" style="width:55%;height:50px;margin-bottom:14px"></div><div class="sk" style="height:12px;margin-bottom:36px"></div>' + w.repeat(3);
}

// Somma i token di tutti i workflow della settimana (ultimo giro di ciascuno).
function week(ws) {
  var by = { free: 0, muse: 0, codex: 0, claude: 0 }, tot = 0, ex = false;
  for (const w of ws) { var ph = H.wfPhases(w.last); if (ph.example) ex = true; var t = H.wfTokens(ph); for (const k in by) by[k] += t.by[k] || 0; tot += t.total; }
  return { by: by, total: tot, saved: tot - by.claude, pct: tot ? Math.round((tot - by.claude) / tot * 100) : 0, example: ex };
}

function miniFlow(w) {
  var ph = H.wfPhases(w.last).phases;
  return '<div class="mf" aria-hidden="true">' + ph.map(function (p, i) {
    return (i ? '<em></em>' : '') + '<span class="' + (p.executor ? 'x-' + p.executor : '') + (p.outcome === 'error' ? ' err' : '') + '"><i></i>' + H.esc(p.title) + '</span>';
  }).join('') + '</div>';
}

function wfHtml(w, i, now) {
  var open = ui.wf === i, t = H.wfTokens(H.wfPhases(w.last)), bad = w.last.outcome === 'error';
  var h = '<div class="w"><button aria-expanded="' + open + '" data-wf="' + i + '"><span class="n"><b>' + H.esc(w.title) + '</b><small class="' + (bad ? 'bad' : '') + '">' + H.esc(H.when(w.last.at, now) + ' · ' + H.outcome(w.last.outcome) + (w.last.durationMs ? ' in ' + H.dur(w.last.durationMs) : '')) + '</small></span>' +
    '<span class="p">' + (t.saved ? '<b>' + t.pct + '%</b><small>' + H.tok(t.saved) + ' risparmiati</small>' : '<b>' + H.tok(t.total) + '</b><small>token, tutti Claude</small>') + '</span>' + (open ? '' : miniFlow(w)) + '</button>';
  if (open) {
    h += '<div class="body">' + (w.last.summary ? '<p>' + H.esc(w.last.summary) + '</p>' : '') + H.flowHtml(w, now) +
      (w.runs.length > 1 ? '<div class="hist">Giri precedenti: ' + w.runs.slice(1, 6).map(function (r) { return H.short(r.at, now) + ' ' + (r.outcome === 'error' ? 'fallito' : 'riuscito'); }).join(' · ') + '</div>' : '') + '</div>';
  }
  return h + '</div>';
}

function itemHtml(c, now) {
  var open = ui.item === c.key, l = c.last || {}, s = ui.saved[c.key];
  var st = c.level === 'te' ? '<span class="st te">ti aspetta</span>' : c.level === 'rotto' ? '<span class="st bad">rotta</span>' : '<span class="st">' + H.esc(l.at ? H.short(l.at, now) : 'mai') + '</span>';
  var h = '<div class="li" data-li="' + H.esc(c.key) + '"><b>' + H.esc(c.title) + '</b>' + st + '<small>' + H.esc(c.level === 'te' || c.level === 'rotto' ? (c.reason || '') : H.forYou(c)) + '</small>';
  if (open) {
    var br = H.ifBroken(c);
    h += '<div class="det">' + (c.level === 'te' || c.level === 'rotto' ? '<p>' + H.esc(H.forYou(c)) + '</p>' : '') +
      (br ? '<p><span class="lbl">Se si rompe: </span>' + H.esc(br) + '</p>' : '') +
      '<p class="lbl">Ultimo ' + H.esc(l.at ? H.when(l.at, now) + ', ' + H.outcome(l.outcome) : 'mai') + (c.next ? ' · prossimo ' + H.esc(H.when(c.next, now)) : '') + '</p>' +
      (s ? '<p class="ok-msg">' + H.esc(s) + '</p>' : '<div class="acts"><button class="btn pri" data-a="ok">Va bene così</button><button class="btn" data-a="cambia">Va cambiata</button></div><div class="note"><label class="sr" for="n' + H.esc(c.key) + '">Cosa va cambiato</label><textarea id="n' + H.esc(c.key) + '" placeholder="Cosa va cambiato? Lo passo a un agente."></textarea><div><button class="btn pri" data-a="salva">Manda</button></div></div>') + '</div>';
  } else {
    h += '<button class="sr" data-it="' + H.esc(c.key) + '">Apri ' + H.esc(c.title) + '</button>';
  }
  return h + '</div>';
}

function render() {
  var m = model, now = m.checkedAt, ws = H.workflows(m), q = (m.needsYou || []).concat(m.broken || []);
  var h = '';
  if (q.length) {
    var c = q[0];
    h += '<div class="alert' + (c.level === 'rotto' ? ' bad' : '') + '"><span class="k">' + (c.level === 'te' ? 'Ti aspetta' : 'Rotta') + '</span><span class="t">' + H.esc(c.title) + (q.length > 1 ? ' e altre ' + (q.length - 1) : '') + '</span><button data-go="' + H.esc(H.areaOf(c)) + '|' + H.esc(c.key) + '">Vedi</button></div>';
  } else {
    h += '<p class="calm"><b>Tutto regolare.</b> ' + H.all(m).length + ' automazioni, ' + H.n((m.verdict || {}).runsToday) + ' giri oggi.</p>';
  }
  if (ws.length) {
    var wk = week(ws);
    h += '<section class="hero"><h1>Workflow, ultimi ' + ((m.workflows || {}).days || 7) + ' giorni</h1>' + (wk.saved ? '<div class="big"><b>' + wk.pct + '%</b><span>dei token non è passato da Claude: ' + H.tok(wk.saved) + ' su ' + H.tok(wk.total) + '.</span></div>' : '<div class="big none"><b>' + H.tok(wk.total) + '</b><span>token, tutti su Claude. Nessun passo è andato a gratis, Muse o Codex: qui si può risparmiare.</span></div>') +
      '<div class="fl-bar" role="img" aria-label="Token per esecutore">' + ['free', 'muse', 'codex', 'claude'].map(function (k) { return wk.by[k] ? '<i class="x-' + k + '" style="flex:' + wk.by[k] + '"></i>' : ''; }).join('') + '</div>' +
      '<div class="fl-leg">' + ['free', 'muse', 'codex', 'claude'].filter(function (k) { return wk.by[k]; }).map(function (k) { return '<span class="x-' + k + '"><i></i>' + H.execName(k) + ' ' + H.tok(wk.by[k]) + '</span>'; }).join('') + '</div>' +
      (wk.example ? '<div class="flag">Esecutori e token di esempio: l’hub non li registra ancora.</div>' : '') + '</section>';
    h += '<section class="wfs"><h2>Ogni workflow <span>' + ws.length + ' · tocca per il diagramma</span></h2>' + ws.map(function (w, i) { return ui.allWf || i < 5 ? wfHtml(w, i, now) : ''; }).join('') + (ws.length > 5 ? '<button class="btn" data-allwf>' + (ui.allWf ? 'Mostra meno' : 'Mostra tutti i ' + ws.length) + '</button>' : '') + '</section>';
  }
  var gs = H.areas(m).filter(function (g) { return g.cards.length; });
  h += '<section class="areas"><h2>Le automazioni, per scopo <span>' + H.all(m).length + '</span></h2><div class="ag">' + gs.map(function (g) {
    return '<button class="a" aria-expanded="' + (ui.area === g.id) + '" data-area="' + g.id + '"><b>' + H.esc(g.title) + '</b><span class="' + (g.te ? 'te' : g.rotto ? 'bad' : '') + '">' + H.esc(H.areaWord(g)) + ' · ' + g.cards.length + '</span></button>';
  }).join('') + '</div>';
  var ga = gs.find(function (g) { return g.id === ui.area; });
  if (ga) h += '<div class="al"><p class="ld">' + H.esc(ga.lede) + '</p>' + ga.cards.map(function (c) { return itemHtml(c, now); }).join('') + '</div>';
  h += '</section>';
  $('app').innerHTML = h;
}

function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 2400); }
function find(k) { return H.all(model).find(function (c) { return c.key === k; }); }
async function act(el, a) {
  var li = el.closest('.li'), c = find(li.dataset.li); if (!c) return;
  if (a === 'cambia') { li.querySelector('.note').classList.add('on'); li.querySelector('textarea').focus(); return; }
  var r;
  if (a === 'salva') { var n = li.querySelector('textarea').value.trim(); if (!n) return li.querySelector('textarea').focus(); r = await H.vote(c, 'cambia', n); if (r && r.ok !== false) ui.saved[c.key] = 'Passata a un agente.'; }
  if (a === 'ok') { r = await H.vote(c, 'ok'); if (r && r.ok !== false) ui.saved[c.key] = 'Segnata come «va bene».'; }
  toast(r && r.ok !== false ? 'Salvato' : 'Non salvato, riprova');
  render();
}
document.addEventListener('click', function (e) {
  var t = e.target, b;
  if ((b = t.closest('[data-a]'))) return act(b, b.dataset.a);
  if ((b = t.closest('[data-wf]'))) { var i = +b.dataset.wf; ui.wf = ui.wf === i ? -1 : i; render(); var f = document.querySelector('[data-wf="' + i + '"]'); if (f) f.focus(); return; }
  if ((b = t.closest('[data-area]'))) { ui.area = ui.area === b.dataset.area ? null : b.dataset.area; ui.item = null; render(); return; }
  if ((b = t.closest('[data-go]'))) { var p = b.dataset.go.split('|'); ui.area = p[0]; ui.item = p[1]; render(); var el = document.querySelector('[data-li="' + CSS.escape(p[1]) + '"]'); if (el) el.scrollIntoView({ block: 'center' }); return; }
  if ((b = t.closest('.li')) && !t.closest('.det')) { var k = b.dataset.li; ui.item = ui.item === k ? null : k; render(); return; }
  if (t.closest('[data-allwf]')) { ui.allWf = !ui.allWf; render(); return; }
  if (t.closest('[data-retry]')) refresh();
});
document.addEventListener('keydown', function (e) { if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); act(e.target, 'salva'); } });

async function refresh() {
  var m = await H.load();
  if (!m) { if (!model) $('app').innerHTML = '<p class="calm" style="color:var(--fg)">Non riesco a leggere le automazioni: l’hub non risponde. Se il Mac è sotto carico può metterci un minuto.</p><button class="btn pri" data-retry>Riprova</button>'; return; }
  model = m;
  if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render();
}
$('app').innerHTML = skeleton();
refresh();
setInterval(refresh, 60000);
</script>
