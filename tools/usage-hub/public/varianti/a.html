<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automazioni · Il quadro</title>
<link rel="stylesheet" href="/varianti/base.css">
<style>
/* A · Il quadro: una colonna, una cosa importante in cima, poi le aree e i workflow. */
:root { --bg:#0d0e10; --s1:#141518; --s2:#1a1c20; --line:#24262b; }
.bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; height:48px; padding:0 20px; background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.bar b { font-weight:600; letter-spacing:-.01em; }
.bar nav { display:flex; gap:16px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
.bar nav::-webkit-scrollbar { display:none; }
.bar nav a { color:var(--mut); text-decoration:none; white-space:nowrap; }
.bar nav a[aria-current], .bar nav a:hover { color:var(--fg); }
.bar .t { color:var(--mut); font-size:12px; white-space:nowrap; }
main { max-width:720px; margin:0 auto; padding:36px 20px 80px; }

h1 { font-size:28px; line-height:1.15; font-weight:600; letter-spacing:-.025em; margin:0; }
.sum { color:var(--fg2); margin:8px 0 32px; }

/* La cosa che ti aspetta */
.focus { border:1px solid var(--line); border-radius:12px; background:var(--s1); padding:20px; margin-bottom:44px; }
.focus .k { font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--te); }
.focus.rotto .k { color:var(--bad); }
.focus h2 { font-size:20px; font-weight:600; letter-spacing:-.015em; margin:6px 0 4px; }
.focus .why { margin:0 0 14px; }
.focus .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; padding-top:14px; border-top:1px solid var(--line); }
.focus .two h3 { font-size:12px; font-weight:500; color:var(--mut); margin:0 0 3px; }
.focus .two p { margin:0; font-size:13.5px; }
.acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.btn { min-height:34px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:var(--s2); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
.btn:hover { border-color:var(--fg2); }
.btn.pri { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
.btn.q { border-color:transparent; background:none; color:var(--mut); }
.queue { margin-top:16px; font-size:13px; color:var(--mut); }
.queue button { border:0; background:none; padding:0; color:var(--fg2); cursor:pointer; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; min-height:24px; }
.note { display:none; flex-direction:column; gap:8px; margin-top:12px; }
.note.on { display:flex; }
.note textarea { min-height:72px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; resize:vertical; }
.done { color:var(--ok); margin:0; }

/* Sezioni */
.sec { margin-bottom:44px; }
.sec > h2 { font-size:15px; font-weight:600; margin:0 0 2px; }
.sec > p { color:var(--mut); font-size:13px; margin:0 0 12px; }

/* Aree */
.area { border-top:1px solid var(--line); }
.area:last-child { border-bottom:1px solid var(--line); }
.ah { width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; align-items:center; padding:14px 0; border:0; background:none; text-align:left; cursor:pointer; }
.ah b { font-weight:600; font-size:15px; }
.ah small { display:block; color:var(--mut); font-size:13px; }
.ah .r { display:flex; align-items:center; gap:12px; }
.ah .w { font-size:13px; color:var(--fg2); min-width:84px; text-align:right; }
.ah .w.te { color:var(--te); } .ah .w.bad { color:var(--bad); }
.ticks { display:flex; gap:2px; align-items:flex-end; height:16px; }
.ticks i { width:3px; height:10px; border-radius:1px; background:var(--s3); }
.ticks i.ok { background:color-mix(in srgb,var(--ok) 70%,var(--s3)); }
.ticks i.error { background:var(--bad); height:16px; }
.items { padding:0 0 12px; }
.it { border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent); }
.it > button { width:100%; display:grid; grid-template-columns:8px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border:0; background:none; text-align:left; cursor:pointer; }
.it .d { width:6px; height:6px; border-radius:50%; background:var(--s3); }
.it .d.te { background:var(--te); } .it .d.rotto { background:var(--bad); }
.it .n { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it .wh { font-size:12.5px; color:var(--mut); white-space:nowrap; }
.det { padding:2px 0 16px 20px; }
.det p { margin:0 0 8px; font-size:13.5px; }
.det .lbl { color:var(--mut); }
.det .row { display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--fg2); margin:10px 0 12px; }
.det details { margin-top:10px; font-size:12px; color:var(--mut); }
.det details pre { white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--mono); font-size:11.5px; background:var(--s1); padding:8px 10px; border-radius:6px; color:var(--fg2); }
.det summary { cursor:pointer; min-height:24px; }

/* Workflow */
.wf { border-top:1px solid var(--line); }
.wf:last-child { border-bottom:1px solid var(--line); }
.wf > button { width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 16px; padding:14px 0; border:0; background:none; text-align:left; cursor:pointer; }
.wf b { font-weight:600; }
.wf small { display:block; color:var(--mut); font-size:13px; }
.wf .pc { text-align:right; font-variant-numeric:tabular-nums; }
.wf .pc strong { display:block; font-size:15px; font-weight:600; }
.wf .pc span { font-size:12px; color:var(--mut); }
.wfb { padding:6px 0 22px; }
.wfb > p { margin:0 0 16px; color:var(--fg2); font-size:13.5px; }

@media (max-width:520px) {
  main { padding:26px 16px 64px; }
  h1 { font-size:24px; }
  .focus { padding:16px; }
  .focus .two { grid-template-columns:1fr; }
  .ah .ticks { display:none; }
  .bar .t { display:none; }
}
</style>
<body>
<header class="bar"><b>Hub</b><nav aria-label="Sezioni"><a href="#" aria-current="page">Automazioni</a><a href="/#sessions">Sessioni</a><a href="/#accounts">Account</a><a href="/#usage">Consumi</a><a href="/#overview">Panoramica</a></nav><span class="t" id="fresh"></span></header>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="/varianti/common.js"></script>
<script>
var H = HubV, model = null, ui = { focus: 0, area: null, item: null, wf: 0, done: {}, allWf: false };
var $ = function (id) { return document.getElementById(id); };
var NUM = ['Niente', 'Una cosa', 'Due cose', 'Tre cose', 'Quattro cose', 'Cinque cose', 'Sei cose'];

function skeleton() {
  var row = '<div style="display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line)"><div style="flex:1"><div class="sk" style="width:30%;height:15px;margin-bottom:6px"></div><div class="sk" style="width:55%;height:12px"></div></div><div class="sk" style="width:90px;height:14px"></div></div>';
  return '<span class="sr">Carico le automazioni…</span><div class="sk" style="width:55%;height:28px"></div><div class="sk" style="width:40%;height:14px;margin:12px 0 32px"></div>' +
    '<div class="sk" style="height:190px;border-radius:12px;margin-bottom:44px"></div>' + row.repeat(4);
}

function queue() { return (model.needsYou || []).concat(model.broken || []); }
function ticks(runs) {
  return '<span class="ticks" aria-hidden="true">' + runs.map(function (h) { return '<i class="' + (h.outcome === 'error' ? 'error' : h.outcome === 'ok' ? 'ok' : '') + '"></i>'; }).join('') + '</span>';
}

function focusHtml(now) {
  var q = queue();
  if (!q.length) return '';
  var i = Math.min(ui.focus, q.length - 1), c = q[i], done = ui.done[c.key];
  var br = H.ifBroken(c);
  var h = '<section class="focus ' + c.level + '" aria-labelledby="ft"><div class="k">' + (c.level === 'te' ? 'Ti aspetta' : 'Rotta, può aspettare') + '</div>' +
    '<h2 id="ft">' + H.esc(c.title) + '</h2><p class="why">' + H.esc(c.reason || H.line(c, now)) + '</p>' +
    '<div class="two"><div><h3>Cosa fa per te</h3><p>' + H.esc(H.forYou(c) || '—') + '</p></div><div><h3>Se resta così</h3><p>' + H.esc(br || 'Non è ancora scritto.') + '</p></div></div>' +
    (done ? '<p class="done">' + H.esc(done) + '</p>' : '<div class="acts"><button class="btn pri" data-a="ok">Va bene così</button><button class="btn" data-a="cambia">Va cambiata</button><a class="btn q" href="/#automations">Altro</a></div>' +
      '<div class="note" id="note"><label for="nt" class="sr">Cosa va cambiato</label><textarea id="nt" placeholder="Cosa va cambiato? Lo passo a un agente."></textarea><div><button class="btn pri" data-a="salva">Manda</button></div></div>');
  var rest = q.filter(function (x, j) { return j !== i; });
  if (rest.length) h += '<div class="queue">Poi: ' + rest.map(function (x) { return '<button data-q="' + q.indexOf(x) + '">' + H.esc(x.title) + '</button>'; }).join(', ') + '</div>';
  return h + '</section>';
}

function itemHtml(c, now) {
  var open = ui.item === c.key, l = c.last || {};
  var wh = c.level === 'te' ? 'ti aspetta' : c.level === 'rotto' ? 'rotta' : (l.at ? H.short(l.at, now) : 'mai');
  var h = '<div class="it"><button aria-expanded="' + open + '" data-it="' + H.esc(c.key) + '"><span class="d ' + c.level + '" aria-hidden="true"></span><span class="n">' + H.esc(c.title) + '</span><span class="wh">' + H.esc(wh) + '</span></button>';
  if (open) {
    var br = H.ifBroken(c), t = c.tech || {};
    h += '<div class="det">' + (H.forYou(c) ? '<p>' + H.esc(H.forYou(c)) + '</p>' : '') +
      (br ? '<p><span class="lbl">Se si rompe: </span>' + H.esc(br) + '</p>' : '') +
      '<div class="row"><span>Ultimo ' + H.esc(l.at ? H.when(l.at, now) + ', ' + H.outcome(l.outcome) : 'mai') + '</span>' +
      (c.next ? '<span>Prossimo ' + H.esc((c.nextApprox ? 'verso ' : '') + H.when(c.next, now)) + '</span>' : '') + ticks(H.cardRuns(c, 14)) + '</div>' +
      '<details><summary>Dettagli tecnici</summary><p style="margin:8px 0 4px">' + H.esc(H.sys(c.provider).name) + ' · ' + H.esc(c.key) + (t.schedule ? ' · ' + H.esc(t.schedule) : '') + '</p>' + ((t.command || t.prompt) ? '<pre>' + H.esc(t.command || t.prompt) + '</pre>' : '') + '</details></div>';
  }
  return h + '</div>';
}

function areasHtml(now) {
  var h = '<section class="sec"><h2>Le tue aree</h2><p>Raggruppate per ciò che fanno per te.</p>';
  for (const g of H.areas(model)) {
    if (!g.cards.length) continue;
    var open = ui.area === g.id, w = H.areaWord(g);
    h += '<div class="area"><button class="ah" aria-expanded="' + open + '" data-area="' + g.id + '"><span><b>' + H.esc(g.title) + '</b><small>' + H.esc(g.lede) + '</small></span>' +
      '<span class="r">' + ticks(H.areaRuns(g, 24)) + '<span class="w' + (g.te ? ' te' : g.rotto ? ' bad' : '') + '">' + H.esc(w) + '</span></span></button>';
    if (open) h += '<div class="items">' + g.cards.map(function (c) { return itemHtml(c, now); }).join('') + '</div>';
    h += '</div>';
  }
  return h + '</section>';
}

function wfHtml(now) {
  var ws = H.workflows(model);
  if (!ws.length) return '';
  var wf = model.workflows || {};
  var sum = { total: 0, saved: 0 };
  for (const x of ws) { var tt = H.wfTokens(H.wfPhases(x.last)); sum.total += tt.total; sum.saved += tt.saved; }
  var eff = sum.total ? (sum.saved ? Math.round(sum.saved / sum.total * 100) + '% dei token fuori da Claude' : H.tok(sum.total) + ' token, tutti su Claude') : '';
  var h = '<section class="sec"><h2>Workflow</h2><p>' + wf.total + ' giri negli ultimi ' + wf.days + ' giorni' + (wf.failed ? ', ' + wf.failed + ' falliti' : ', nessuno fallito') + (eff ? ' · <b style="color:' + (sum.saved ? 'var(--fg)' : 'var(--x-claude)') + ';font-weight:600">' + eff + '</b>' : '') + '. Esistono per spendere meno quota Claude.</p>';
  ws.forEach(function (w, i) {
    if (!ui.allWf && i >= 5) return;
    var open = ui.wf === i, t = H.wfTokens(H.wfPhases(w.last));
    h += '<div class="wf"><button aria-expanded="' + open + '" data-wf="' + i + '"><span><b>' + H.esc(w.title) + '</b><small>' + H.esc(H.when(w.last.at, now) + ' · ' + H.outcome(w.last.outcome) + (w.last.durationMs ? ' · ' + H.dur(w.last.durationMs) : '')) + '</small></span>' +
      '<span class="pc">' + (t.saved ? '<strong>' + t.pct + '%</strong><span>fuori da Claude</span>' : '<strong>' + H.tok(t.total) + '</strong><span>token, tutti Claude</span>') + '</span></button>';
    if (open) h += '<div class="wfb">' + (w.last.summary ? '<p>' + H.esc(w.last.summary) + '</p>' : '') + H.flowHtml(w, now) + '</div>';
    h += '</div>';
  });
  if (ws.length > 5) h += '<button class="btn q" data-allwf style="margin-top:8px">' + (ui.allWf ? 'Mostra meno' : 'Mostra tutti i ' + ws.length) + '</button>';
  return h + '</section>';
}

function render() {
  var m = model, now = m.checkedAt, v = m.verdict || {}, q = queue();
  var head = !q.length ? 'Tutto regolare.' : (v.needsYou ? (NUM[v.needsYou] || v.needsYou + ' cose') + (v.needsYou === 1 ? ' ti aspetta.' : ' ti aspettano.') : (NUM[v.broken] || v.broken + ' cose') + (v.broken === 1 ? ' è rotta.' : ' sono rotte.'));
  var cnt = H.all(m).length;
  var h = '<h1>' + H.esc(head) + '</h1><p class="sum">' + (v.needsYou && v.broken ? v.broken + (v.broken === 1 ? ' rotta può aspettare. ' : ' rotte possono aspettare. ') : '') + cnt + ' automazioni in 6 aree · ' + H.n(v.runsToday) + ' giri oggi</p>';
  h += focusHtml(now) + areasHtml(now) + wfHtml(now);
  $('app').innerHTML = h;
  $('fresh').textContent = 'controllato ' + H.ago(m.checkedAt, Date.now());
}

function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 2400); }
async function act(a) {
  var q = queue(), c = q[Math.min(ui.focus, q.length - 1)]; if (!c) return;
  if (a === 'cambia') { $('note').classList.add('on'); $('nt').focus(); return; }
  var r;
  if (a === 'salva') { var n = $('nt').value.trim(); if (!n) return $('nt').focus(); r = await H.vote(c, 'cambia', n); if (r && r.ok !== false) ui.done[c.key] = 'Passata a un agente.'; }
  if (a === 'ok') { r = await H.vote(c, 'ok'); if (r && r.ok !== false) ui.done[c.key] = 'Segnata come «va bene».'; }
  toast(r && r.ok !== false ? 'Salvato' : 'Non salvato, riprova');
  render();
}
function refocus(sel) { var f = document.querySelector(sel); if (f) f.focus(); }
document.addEventListener('click', function (e) {
  var t = e.target, b;
  if ((b = t.closest('[data-a]'))) return act(b.dataset.a);
  if ((b = t.closest('[data-q]'))) { ui.focus = +b.dataset.q; render(); return; }
  if ((b = t.closest('[data-area]'))) { var a = b.dataset.area; ui.area = ui.area === a ? null : a; ui.item = null; render(); refocus('[data-area="' + a + '"]'); return; }
  if ((b = t.closest('[data-it]'))) { var k = b.dataset.it; ui.item = ui.item === k ? null : k; render(); refocus('[data-it="' + CSS.escape(k) + '"]'); return; }
  if ((b = t.closest('[data-wf]'))) { var i = +b.dataset.wf; ui.wf = ui.wf === i ? -1 : i; render(); refocus('[data-wf="' + i + '"]'); return; }
  if (t.closest('[data-allwf]')) { ui.allWf = !ui.allWf; render(); return; }
  if (t.closest('[data-retry]')) refresh();
});
document.addEventListener('keydown', function (e) { if (e.target.id === 'nt' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); act('salva'); } });

async function refresh() {
  var m = await H.load();
  if (!m) { if (!model) $('app').innerHTML = '<h1>Non riesco a leggere le automazioni.</h1><p class="sum">L’hub non risponde. Se il Mac è sotto carico può metterci un minuto.</p><button class="btn pri" data-retry>Riprova</button>'; return; }
  model = m;
  if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') render();
}
$('app').innerHTML = skeleton();
refresh();
setInterval(refresh, 60000);
</script>
