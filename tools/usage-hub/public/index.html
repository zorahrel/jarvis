<!doctype html>
<html lang="it">
<meta charset="utf-8">
<title>Usage hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css">
<body>
<div class="shell">
<header class="top">
  <div class="top-in">
    <a class="hub-mark" href="#overview" aria-label="Hub, torna alla panoramica"><span class="hub-logo"><i data-ic="hub"></i></span><span class="hub-word">Hub</span></a>
    <nav id="nav" aria-label="Sezioni">
      <div class="ng">
        <button data-t="overview"><i data-ic="layout-dashboard"></i><span>Panoramica</span><span class="badge" id="nwait" hidden></span></button>
        <button data-t="journal"><i data-ic="notebook-text"></i><span>Diario</span></button>
        <button data-t="automations"><i data-ic="calendar-clock"></i><span>Automazioni</span><span class="badge" id="nauto" hidden></span></button>
      </div>
      <div class="ng"><span class="ngt">Agenti</span>
        <button data-t="sessions"><i data-ic="terminal"></i><span>Sessioni</span><span class="badge" id="nsess" hidden></span></button>
        <button data-t="projects"><i data-ic="folder-git-2"></i><span>Progetti</span></button>
        <button data-t="activity"><i data-ic="activity"></i><span>Attività</span></button>
        <button data-t="context"><i data-ic="file-stack"></i><span>Contesto</span></button>
      </div>
      <div class="ng"><span class="ngt">Quote</span>
        <button data-t="accounts"><i data-ic="users-round"></i><span>Account</span></button>
        <button data-t="usage"><i data-ic="chart-column"></i><span>Consumi</span></button>
      </div>
      <div class="ng"><span class="ngt">Sistema</span>
        <button data-t="services"><i data-ic="server"></i><span>Servizi</span></button>
        <button data-t="settings"><i data-ic="settings-2"></i><span>Impostazioni</span></button>
        <button data-t="logs"><i data-ic="scroll-text"></i><span>Log</span></button>
      </div>
    </nav>
  </div>
</header>
<main>
  <div class="ph"><h1 id="ptitle">Panoramica</h1><p class="sub" id="sub"></p></div>
  <div class="tab" id="t-overview"><p class="mut small" data-loading>Carico quote, agenti e Mac…</p></div>
  <div class="tab" id="t-journal"></div>
  <div class="tab" id="t-projects"></div>
  <div class="tab" id="t-accounts"></div>
  <div class="tab" id="t-usage"></div>
  <div class="tab" id="t-sessions"></div>
  <div class="tab" id="t-activity"></div>
  <div class="tab" id="t-context"></div>
  <div class="tab" id="t-services"></div>
  <div class="tab" id="t-automations"></div>
  <div class="tab" id="t-settings"></div>
  <div class="tab" id="t-logs"></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/icons.js"></script>
<script src="/actions.js"></script>
<script src="/automations-view.js"></script>
<script src="/pages-view.js"></script>
<script src="/automations.js"></script>
<script src="/vdm-tabs.js"></script>
<script src="/pages.js"></script>
<script src="/app.js"></script>
